<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Notes</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="css/bootstrap.min.css"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="css/bootstrap-icons.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- PWA Manifest -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <!-- PWA / Browser theme color -->
    <meta
        name="theme-color"
        content="#0d6efd"
    >

    <!-- iOS -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="My Notes"
    >

    <link 
        rel="icon" 
        type="image/png" 
        href="./favicon.png"
    >
</head>
<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="app-header">
    <div class="container">
        <div class="header-top">
            <div class="app-brand">
                <h1 class="app-title">
                    <i class="bi bi-journal-text"></i>
                    My Notes
                </h1>
                <div class="app-subtitle">
                    Manage your notes easily
                </div>
            </div>

            <div class="header-actions">
                <!-- Theme -->
                <button
                    type="button"
                    class="btn btn-outline-secondary theme-button"
                    id="btnTheme"
                    title="Change theme"
                >
                    <i
                        class="bi bi-moon-fill"
                        id="themeIcon"
                    ></i>
                </button>

                <!-- Backup Notes -->
                <button
                    type="button"
                    class="btn btn-outline-secondary backup-button"
                    id="btnBackupNotes"
                    title="Back up notes"
                >
                    <i class="bi bi-download"></i>
                    <span>Backup</span>
                </button>
                
                <!-- Restore Notes -->
                <button
                    type="button"
                    class="btn btn-outline-secondary restore-button"
                    id="btnRestoreNotes"
                    title="Restore notes from backup"
                >
                    <i class="bi bi-upload"></i>
                    <span>Restore</span>
                </button>

                <input
                    type="file"
                    id="restoreFileInput"
                    accept=".json,application/json"
                    hidden
                >

                <!-- New Note -->
                <button
                    type="button"
                    class="btn btn-primary btn-new-note"
                    id="btnNewNote"
                >
                    <i class="bi bi-plus-lg"></i>
                    <span>New Note</span>
                </button>

            </div>
        </div>

        <!-- =================================================
             TOOLBAR
        ================================================= -->

        <div class="toolbar">

            <!-- Search -->
            <div class="search-wrapper">

                <i class="bi bi-search search-icon"></i>

                <input
                    type="search"
                    id="searchInput"
                    class="form-control search-input"
                    placeholder="Search notes..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="search-clear d-none"
                    id="btnClearSearch"
                    title="Clear search"
                >
                    <i class="bi bi-x-circle-fill"></i>
                </button>

            </div>

            <!-- Sorting -->
            <div class="sort-wrapper">

                <select
                    id="sortSelect"
                    class="form-select"
                >
                    <option value="updated-desc">
                        Recently updated
                    </option>

                    <option value="created-desc">
                        Recently created
                    </option>

                    <option value="title-asc">
                        Title A-Z
                    </option>

                    <option value="title-desc">
                        Title Z-A
                    </option>

                    <option value="manual">
                        Manual sorting
                    </option>
                </select>

            </div>
        </div>

        <!-- Notes counter -->
        <div
            class="notes-counter"
            id="notesCounter"
        >
            0 Notes
        </div>
    </div>
</header>

<!-- =========================================================
     MAIN
========================================================= -->

<main class="container py-4">

    <!-- Empty state -->
    <div
        id="emptyState"
        class="empty-state d-none"
    >

        <i
            class="bi bi-journal-x"
            id="emptyStateIcon"
        ></i>

        <h3 id="emptyStateTitle">
            No notes yet
        </h3>

        <p id="emptyStateMessage">
            Click the New Note button
            to create your first note.
        </p>

        <button
            type="button"
            class="btn btn-primary"
            id="btnEmptyNewNote"
        >
            <i class="bi bi-plus-lg"></i>
            Create New Note
        </button>

    </div>

    <!-- Notes -->
    <div
        class="row g-4"
        id="notesContainer"
    ></div>

</main>

<!-- =========================================================
     NOTE MODAL
========================================================= -->

<div
    class="modal fade"
    id="noteModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div
        class="modal-dialog modal-dialog-centered modal-lg"
    >
        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="noteModalTitle"
                >
                    New Note
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form id="noteForm">

                    <input
                        type="hidden"
                        id="noteId"
                    >

                    <!-- Title -->
                    <div class="mb-3">
                        <div class="form-label-row">

                            <label
                                for="noteTitle"
                                class="form-label"
                            >
                                Title
                            </label>

                            <span
                                class="character-counter"
                                id="titleCounter"
                            >
                                0 / 200
                            </span>

                        </div>

                        <input
                            type="text"
                            class="form-control"
                            id="noteTitle"
                            maxlength="200"
                            placeholder="Note title"
                            autocomplete="off"
                        >

                        <div class="invalid-feedback">
                            Title cannot be empty.
                        </div>
                    </div>

                    <!-- Body -->
                    <div class="mb-3">
                        <div class="form-label-row">

                            <label
                                for="noteBody"
                                class="form-label"
                            >
                                Note
                            </label>

                            <span
                                class="character-counter"
                                id="bodyCounter"
                            >
                                0 / 5000
                            </span>

                        </div>

                        <textarea
                            class="form-control note-body-input"
                            id="noteBody"
                            maxlength="5000"
                            rows="10"
                            placeholder="Write your note..."
                        ></textarea>

                        <div class="invalid-feedback">
                            Note cannot be empty.
                        </div>
                    </div>

                    <!-- Color -->
                    <div class="mb-3">
                        <label class="form-label">
                            Note color
                        </label>

                        <div
                            class="note-colors"
                            id="noteColors"
                        >
                            <button
                                type="button"
                                class="color-option color-default active"
                                data-color="default"
                                title="Default"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-yellow"
                                data-color="yellow"
                                title="Yellow"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-green"
                                data-color="green"
                                title="Green"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-blue"
                                data-color="blue"
                                title="Blue"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-purple"
                                data-color="purple"
                                title="Purple"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-red"
                                data-color="red"
                                title="Red"
                            ></button>
                        </div>
                    </div>

                    <!-- Date -->
                    <div
                        class="note-date"
                        id="noteDate"
                    ></div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnCancel"
                >
                    <i class="bi bi-x-lg"></i>
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-danger"
                    id="btnDelete"
                >
                    <i class="bi bi-trash"></i>
                    Delete
                </button>

                <button
                    type="button"
                    class="btn btn-warning"
                    id="btnUpdate"
                >
                    <i class="bi bi-pencil-square"></i>
                    Update
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btnSave"
                >
                    <i class="bi bi-check-lg"></i>
                    Save
                </button>
            </div>
        </div>
    </div>
</div>

<!-- =========================================================
     CONFIRMATION MODAL
========================================================= -->

<div
    class="modal fade"
    id="confirmModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div
        class="modal-dialog modal-dialog-centered"
    >
        <div class="modal-content">
            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="confirmModalTitle"
                >
                    Confirm Action
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>

            <div class="modal-body">
                <div class="confirmation-icon">
                    <i
                        class="bi bi-question-circle"
                        id="confirmationIcon"
                    ></i>
                </div>

                <p
                    class="confirmation-message"
                    id="confirmModalMessage"
                ></p>
            </div>

            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btnConfirmAction"
                >
                    Confirm
                </button>
            </div>
        </div>
    </div>
</div>

<!-- =========================================================
     TOAST
========================================================= -->

<div
    class="toast-container position-fixed bottom-0 end-0 p-3"
    id="toastContainer"
></div>

<!-- Bootstrap JS -->
<script src="js/bootstrap.bundle.min.js"></script>

<!-- Application JS -->
<script src="js/app.js"></script>

<!-- Service Worker -->
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener(
            "load",
            () => {
                navigator.serviceWorker
                    .register("./service-worker.js")
                    .then(
                        registration => {

                            console.log(
                                "Service Worker active:",
                                registration.scope
                            );

                        }
                    )
                    .catch(
                        error => {

                            console.error(
                                "Service Worker registration error:",
                                error
                            );

                        }
                    );
            }
        );
    }
</script>

</body>
</html>
